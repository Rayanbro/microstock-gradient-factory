name: Gradient Pilot
on:
  push:
    paths:
      - '.github/workflows/gradient-pilot.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'Starting image index (0-9999)'
        required: true
        default: '0'
      count:
        description: 'Images in this run (1-50); use 2 for pilot'
        required: true
        default: '2'
permissions:
  contents: read
concurrency:
  group: gradient-pilot
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Render deterministic backgrounds
        env:
          START: ${{ github.event_name == 'push' && '0' || inputs.start }}
          COUNT: ${{ github.event_name == 'push' && '50' || inputs.count }}
        run: python generate.py --start "$START" --count "$COUNT" --out output
      - name: Upload to Google Drive (only if configured)
        if: ${{ env.RCLONE_CONFIG_B64 != '' }}
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DRIVE_FOLDER_ID:-}" ]]; then
            echo "DRIVE_FOLDER_ID repository variable is missing"
            exit 1
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone copy output/ "gdrive:" --drive-root-folder-id "$DRIVE_FOLDER_ID" --checkers 4 --transfers 2 --retries 3
          rm -f "$HOME/.config/rclone/rclone.conf"
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-production-${{ github.event_name == 'push' && '0' || inputs.start }}
          path: output/
          retention-days: 7
          if-no-files-found: error
